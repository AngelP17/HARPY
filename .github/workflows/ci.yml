name: CI

# Deterministic lanes only: unit, contract, integration against RECORDED real-source fixtures.
# Never depends on an upstream API being up. Live data is proven by monitor.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: harpy-core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p harpy-core --all-targets --locked -- -D warnings
      - run: cargo test -p harpy-core --locked

  web:
    name: web (typecheck, lint, unit, build, no-mock guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - working-directory: apps/web
        run: |
          npm run typecheck
          npm run lint
          npm test
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /HARPY
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          npm run check:no-mocks -- out
